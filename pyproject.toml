[project]
name = "outcome-ai-backend"
version = "0.1.0"
description = "Outcome AI backend: API, worker, core contracts, models and Crustdata adapter"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "psycopg[binary]",
    "psycopg-pool",
    "PyJWT[crypto]",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["."]
addopts = "-q"
